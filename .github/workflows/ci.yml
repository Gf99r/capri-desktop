name: CI

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Apply Mega CAPRI companion adapter
        shell: pwsh
        run: |
          node integrations/companion-adapter/apply-companion-adapter.cjs integrations/capri-desktop1 integrations/companion-adapter/core-bridge.js
      - name: Build unified .NET host
        run: dotnet build cross/Capri.Cross.csproj -c Release -o out/cross
      - name: Install and test coding-agent companion
        shell: pwsh
        run: |
          npm ci --prefix integrations/capri-desktop1
          node --test integrations/companion-adapter/tests/*.test.js
          npm run test:hooks --prefix integrations/capri-desktop1
      - name: Build and smoke test
        shell: pwsh
        run: ./ci/build-windows.ps1 -OutputDirectory out/windows -SmokeTest -SmokeSeconds 180
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-windows
          path: out/windows/smoke

  standalone-windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Apply companion adapter
        run: node integrations/companion-adapter/apply-companion-adapter.cjs integrations/capri-desktop1 integrations/companion-adapter/core-bridge.js
      - name: Publish self-contained .NET host
        run: dotnet publish cross/Capri.Cross.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o out/standalone/host
      - name: Package Electron companion with its runtime
        shell: pwsh
        run: |
          Push-Location integrations/capri-desktop1
          try {
            npm ci
            npx electron-builder --win --dir
          }
          finally {
            Pop-Location
          }
          $companionOutput = 'integrations/capri-desktop1/dist/win-unpacked'
          if (-not (Test-Path -LiteralPath $companionOutput)) { throw "Electron packaging did not produce $companionOutput" }
          New-Item -ItemType Directory -Force out/standalone/companion | Out-Null
          Copy-Item "$companionOutput/*" out/standalone/companion -Recurse -Force
      - name: Assemble standalone launcher
        shell: pwsh
        run: Copy-Item packaging/Launch-CAPRI.ps1 out/standalone/Launch-CAPRI.ps1
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build single-file installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/installer | Out-Null
          & 'C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe' packaging/CAPRI-Mega.iss
          if ($LASTEXITCODE -ne 0) { throw 'CAPRI standalone installer build failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: CAPRI-Mega-Windows-Installer
          path: out/installer/CAPRI-Mega-Setup.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build cross/Capri.Cross.csproj -c Release -o out/linux
      - name: Install a test desktop
        timeout-minutes: 15
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends xvfb xauth openbox xcompmgr libice6 libsm6 libfontconfig1
      - name: Smoke test
        timeout-minutes: 5
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" bash -c 'openbox & sleep 2; xcompmgr & sleep 1; out/linux/Capri --smoke "$PWD/smoke/linux"' || true
          cat smoke/linux/smoke-test.txt
          ! grep -q '^FAIL' smoke/linux/smoke-test.txt
          test "$(grep -c '^PASS' smoke/linux/smoke-test.txt)" -ge 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-linux
          path: smoke

  mac:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build cross/Capri.Cross.csproj -c Release -o out/mac
      - name: Smoke test
        timeout-minutes: 5
        run: |
          out/mac/Capri --smoke "$PWD/smoke/mac" || true
          cat smoke/mac/smoke-test.txt
          ! grep -q '^FAIL' smoke/mac/smoke-test.txt
          test "$(grep -c '^PASS' smoke/mac/smoke-test.txt)" -ge 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-mac
          path: smoke
